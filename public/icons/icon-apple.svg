<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a2a4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#7C4DFF"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Dumbbell icon -->
  <g transform="translate(256, 220)">
    <!-- Left weight -->
    <rect x="-120" y="-40" width="30" height="80" rx="8" fill="url(#accent)" opacity="0.9"/>
    <rect x="-100" y="-30" width="15" height="60" rx="6" fill="url(#accent)" opacity="0.7"/>
    <!-- Bar -->
    <rect x="-85" y="-8" width="170" height="16" rx="4" fill="url(#accent)"/>
    <!-- Right weight -->
    <rect x="90" y="-40" width="30" height="80" rx="8" fill="url(#accent)" opacity="0.9"/>
    <rect x="85" y="-30" width="15" height="60" rx="6" fill="url(#accent)" opacity="0.7"/>
  </g>
  <!-- Text -->
  <text x="256" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="48" fill="url(#accent)">Builder</text>
  <text x="256" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#8899aa">Build Yourself</text>
</svg>
